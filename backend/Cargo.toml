[package]
name    = "heimdall-backend"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "heimdall-backend"
path = "src/main.rs"

[dependencies]
# ── Web framework ──────────────────────────────────────────────────────────────
axum            = { version = "0.8",  features = ["macros"] }
tower-http      = { version = "0.6",  features = ["trace", "cors", "request-id", "timeout"] }
tower           = { version = "0.5",  features = ["util"] }

# ── Async runtime ──────────────────────────────────────────────────────────────
tokio           = { version = "1",    features = ["full"] }

# ── Database ───────────────────────────────────────────────────────────────────
sqlx            = { version = "0.8",  features = ["runtime-tokio", "mysql", "chrono", "uuid", "json", "migrate"] }

# ── Serialisation ──────────────────────────────────────────────────────────────
serde           = { version = "1",    features = ["derive"] }
serde_json      = "1"

# ── Config / environment ───────────────────────────────────────────────────────
dotenvy         = "0.15"

# ── Logging / tracing ─────────────────────────────────────────────────────────
tracing             = "0.1"
tracing-subscriber  = { version = "0.3", features = ["env-filter", "fmt"] }

# ── Error handling ─────────────────────────────────────────────────────────────
thiserror   = "2"
anyhow      = "1"

# ── Types ─────────────────────────────────────────────────────────────────────
uuid    = { version = "1", features = ["v4", "serde"] }
chrono  = { version = "0.4", features = ["serde"] }
